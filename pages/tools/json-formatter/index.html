<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JSON Formatter | AllDev Tools</title>
  <link rel="stylesheet" href="../../assets/styles.css">

</head>
<body>
   <nav>
      <div class="logo">
        <a href="../../">AllDev</a>
         </div>
         <ul>
           <li><a href="../../">Home</a></li>
           <li><a href="../index.html">Tools</a></li>
           <li><a href="/tutorials">Blog</a></li>
           <li><a href="/about">About</a></li>
         </ul>
    </nav>
    <main>
      <h1>JSON Formatter</h1>
        <p>Paste your JSON below and click “Format”.</p>

        <textarea id="input" placeholder='Paste JSON here...'></textarea>
        <br>
        <button onclick="formatJSON()">Format</button>

        <textarea id="output" readonly placeholder='Formatted JSON will appear here...'></textarea>
    </main>
    <footer>
      <p><em>made with 💜 and coffee.</em></p>     
      <p> <a href="/about">About</a> </p>  

     </footer>

  <script>
    function formatJSON() {
      const input = document.getElementById('input').value;
      try {
        const parsed = JSON.parse(input);
        document.getElementById('output').value = JSON.stringify(parsed, null, 2);
      } catch (e) {
        document.getElementById('output').value = 'Invalid JSON! ❌';
      }
    }
  </script>
</body>
</html>
