<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>YAML Helper | AllDev</title>
  <link href="https://fonts.googleapis.com/css2?family=Asap:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../assets/styles.css">

</head>


<body>
   <nav>
      <div class="logo">
        <a href="../../">AllDev</a>
         </div>
         <ul>
           <li><a href="../../">Home</a></li>
           <li><a href="../index.html">Tools</a></li>
           <li><a href="/tutorials">Blog</a></li>
           <li><a href="/about">About</a></li>
         </ul>
    </nav>

  <main>
    <h1>YAML Helper</h1>
    <p>Write YAML confidently — format, validate, and convert in seconds.</p>

    <div class="tool-container">
      <textarea id="yamlInput" placeholder="Paste or write your YAML here..."></textarea>
      
      <div class="button-group">
        <button onclick="validateYAML()">Validate</button>
        <button onclick="beautifyYAML()">Beautify</button>
        <button onclick="convertJSONtoYAML()">JSON → YAML</button>
        <button onclick="convertYAMLtoJSON()">YAML → JSON</button>
        <button onclick="copyYAML()">Copy</button>
        <button onclick="downloadYAML()">Download</button>
        <button onclick="clearYAML()">Clear</button>
      </div>

     <textarea class="output" id="yamlOutput" readonly placeholder='Output / Errors will appear here...'></textarea>
     <!-- <div class="output" id="yamlOutput">Output / Errors will appear here</div>-->
    </div>
  </main>

  <footer>
    <p><em>made with 💜 and coffee.</em></p>
    <p><a href="/about">About</a></p>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/js-yaml@4.1.0/dist/js-yaml.min.js"></script>
  <script>
    const input = document.getElementById('yamlInput');
    const output = document.getElementById('yamlOutput');

    function validateYAML() {
       if (input.value.trim() === '') {
            output.value = 'Please enter YAML first. ⚠️';
            return;
       }

      try {
        jsyaml.load(input.value);
        output.value = '✅ YAML is valid!';
      } catch (e) {
        output.value = '❌ Error: ' + e.message;
      }
    }

    function beautifyYAML() {
        if (input.value.trim() === '') {
          output.value = 'Please enter YAML first. ⚠️';
          return;
        }

      try {
        const obj = jsyaml.load(input.value);
        output.value = jsyaml.dump(obj, { indent: 2 });
      } catch (e) {
        output.value = '❌ Error: ' + e.message;
      }
    }

    function convertJSONtoYAML() {
        if (input.value.trim() === '') {
            output.value = 'Please enter JSON first. ⚠️';
            return;
         }

      try {
        const obj = JSON.parse(input.value);
        output.value = jsyaml.dump(obj, { indent: 2 });
      } catch (e) {
        output.value = '❌ Error: Invalid JSON';
      }
    }

    function convertYAMLtoJSON() {
      if (input.value.trim() === '') {
            output.value = 'Please enter YAML first. ⚠️';
            return;
        }

      try {
        const obj = jsyaml.load(input.value);
        output.value = JSON.stringify(obj, null, 2);
      } catch (e) {
        output.value = '❌ Error: Invalid YAML';
      }
    }

    function copyYAML() {
      if (output.value.trim() === '' || output.value === 'Please enter YAML first. ⚠️' || output.value === 'Please enter JSON first. ⚠️' || output.value === 'Please enter YAML or JSON first. ⚠️' 
    || output.value === 'Nothing to download. ⚠️') {
        output.value = 'Please enter YAML or JSON first. ⚠️';
        return;
      }

      navigator.clipboard.writeText(output.value).then(() => {
        alert('Copied to clipboard!');
      });
    }

    function downloadYAML() {
         if (output.value.trim() === '' || output.value === 'Please enter YAML first. ⚠️' || output.value === 'Please enter JSON first. ⚠️' || output.value === 'Please enter YAML or JSON first. ⚠️' 
        || output.value === 'Nothing to download. ⚠️') 
       {
      output.value = 'Nothing to download. ⚠️';
      return;
    }

      const blob = new Blob([output.value], { type: 'text/yaml' });
      const link = document.createElement('a');
      link.href = URL.createObjectURL(blob);
      link.download = 'output.yml';
      link.click();
    }

    function clearYAML() {
      input.value = '';
      output.value = '';
    }




  </script>
</body>
</html>
