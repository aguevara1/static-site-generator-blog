<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Regex Tester | AllDev Tools</title>
    <link rel="stylesheet" href="../../assets/styles.css">

  <style>
    /* Left saved-work panel */
    .workspace {
      display: grid;
      grid-template-columns: 19% 81%;
    }

    .saved-work {
      border-right: 1px solid #ddd;
      padding: 20px;
    }

    .saved-work ul {
      list-style: none;
      padding: 0;
    }
    .saved-work li {
        margin-bottom: 10px;
     }

    .tool-header {
       display: flex;
       justify-content: space-between;
       align-items: center;
   }

    .tool-header h1 {
       font-size: 23px;
       font-weight: 600;
       margin: 0;
   }

   .tool-header button {
       transform: translateX(-15px);
    }

  .saved-work li {
  margin-bottom: 10px;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.delete-work {
  color: #999;
  cursor: pointer;
  font-size: 18px;
  margin-left: 10px;
}

.delete-work:hover {
  color: #555;
}

.saved-work li.active {
  background: #eef6ff;
  color: #1677ff;
}

  </style>


</head>

<body>
   <nav>
      <div class="logo">
        <a href="../../">AllDev</a>
         </div>
         <ul>
           <li><a href="../../">Home</a></li>
           <li><a href="../index.html">Tools</a></li>
           <li><a href="../../about.html">About</a></li>
         </ul>
    </nav>

    <!-- ADDED: workspace wrapper and left panel -->
    <div class="workspace">

      <aside class="saved-work">
        <h3>SAVED WORK</h3>

        <ul id="savedWorkList">
        </ul>
      </aside>

<main>

   <div class="tool-header">
     <h1>Regex Tester</h1>
     <button onclick="saveWork()">Save</button>
   </div>

    <p>Test your Regular Expressions live in the browser!</p>


        <div class="pattern-header">
          <label for="pattern">Regex Pattern:</label>
          <button onclick="clearPattern()">Clear</button>
        </div>
        
           <input type="text" id="pattern" placeholder="e.g. \d+">
         
        <div class="pattern-header">
          <label for="text">Text to Test:</label>
          <button onclick="clearText()">Clear</button>
        </div>

        <textarea id="input" placeholder="Paste your text here..."></textarea>


    <h3>Matches:</h3>
   <!-- <div class="matches" id="matches"></div>-->
    <textarea id="output" readonly placeholder='Output here...'></textarea>

</main>

</div>

<footer>
      <p><em>made with 💜 and coffee.</em></p>     
      <p> <a href="/about">About</a> </p>  

</footer>

    <script>
      let currentUnsavedWork = {
      pattern: "",
      input: "",
      output: ""
      };

    function syncUnsavedWork() {
      if (activeWork === "unsaved") {
         currentUnsavedWork.pattern = document.getElementById("pattern").value;
         currentUnsavedWork.input = document.getElementById("input").value;
         currentUnsavedWork.output = document.getElementById("output").value;
      }
    }

    document.getElementById("pattern").addEventListener("input", syncUnsavedWork);
    document.getElementById("input").addEventListener("input", syncUnsavedWork);
    document.getElementById("output").addEventListener("input", syncUnsavedWork);



    let hasUnsavedWork = false;
    let activeWork = "unsaved";


        const patternInput = document.getElementById('pattern');
        const input = document.getElementById('input');
        const output = document.getElementById('output');

        function updateMatches() {
            const pattern = patternInput.value;
            const text = input.value;

            if (!pattern) {
                output.value = '';
                return;
            }

            try {
                const regex = new RegExp(pattern, 'g'); // global match
               // const highlighted = text.replace(regex, match => `<span class="highlight">${match}</span>`);
                const matches = text.match(regex);

                output.value = matches ? matches.join("\n") : '';
            } catch (err) {
                output.value = 'Invalid regex pattern!';
            }
        }


        function clearPattern(){
            patternInput.value = '';
            patternInput.dispatchEvent(new Event('input'));
           
        }


        function clearText(){
            input.value = '';
            output.value = '';  
        }


        patternInput.addEventListener('input', updateMatches);
        input.addEventListener('input', updateMatches);


function saveWork() {
  // Get both textareas
  const pattern = patternInput.value;
  const input = document.getElementById("input").value;
  const output = document.getElementById("output").value;

  // Don't save if both are empty
 if (pattern.trim() === "" && input.trim() === "" && output.trim() === "") {
    alert("There is nothing to save.")
    return;
  }

  // Save to local storage
  const savedWork = JSON.parse(
    localStorage.getItem("regexTesterSavedWork") || "[]"
  );

  // Trimming Input and Output for Saved entry
  const savedItem = {
    name: input.trim().split(/\s+/).slice(0, 3).join(" ") || "Untitled",
    pattern: pattern,
    input: input,
    output: output
  };

  if (activeWork === "unsaved") {

    // Create a new saved project.
    savedWork.push(savedItem);

    // Activate the new project.
    activeWork = savedWork.length - 1;

    // Clear Unsaved Work only in this case.
    currentUnsavedWork.pattern = "";
    currentUnsavedWork.input = "";
    currentUnsavedWork.output = "";
    hasUnsavedWork = false;

  } else {

    // Update the existing saved project.
    savedWork[activeWork] = savedItem;

    // Leave Unsaved Work completely untouched.
  }

  localStorage.setItem(
    "regexTesterSavedWork",
    JSON.stringify(savedWork)
  );

  loadSavedWork();
}



function loadSavedWork() {

      // Get existing saved work
      const savedWork = JSON.parse(
      localStorage.getItem("regexTesterSavedWork") || "[]"
      );

      // Get the saved work list from the HTML
      const savedWorkList = document.getElementById("savedWorkList");

      // Clear the current list
      savedWorkList.innerHTML = "";

      const unsavedWork = document.createElement("li");

      unsavedWork.textContent = "Unsaved Work";
      unsavedWork.style.cursor = "pointer";

      savedWorkList.appendChild(unsavedWork);

      if (activeWork === "unsaved") {
         unsavedWork.classList.add("active");
     }

    // Restore the current unsaved work
      unsavedWork.onclick = function() {
         document.getElementById("pattern").value = currentUnsavedWork.pattern;
         document.getElementById("input").value = currentUnsavedWork.input;
         document.getElementById("output").value = currentUnsavedWork.output;

         activeWork = "unsaved";
  
         loadSavedWork();
      };

    // Add each saved item to the sidebar
     savedWork.forEach(function(work, index) {

         const li = document.createElement("li");

         if (activeWork === index) {
           li.classList.add("active");
         }

     
        // Saved work name
        const name = document.createElement("span");
        name.textContent = (work.name || `Saved #${index + 1}`).slice(0, 7);

        name.style.cursor = "pointer";


        name.onclick = function() {
           // Preserve the latest unsaved content before leaving it.
           syncUnsavedWork();

           // Load the selected saved project.
           document.getElementById("pattern").value = work.pattern || "";
           document.getElementById("input").value = work.input;
           document.getElementById("output").value = work.output;

           // Activate the selected project.
           activeWork = index;

           loadSavedWork();
        };


       // Delete X
       const deleteButton = document.createElement("span");
       deleteButton.textContent = "×";
       deleteButton.className = "delete-work";

       // Delete this saved item
       deleteButton.onclick = function(){

       savedWork.splice(index, 1);

       if (typeof activeWork === "number") { 
          if (index < activeWork) {
             activeWork--;
        } else if (index === activeWork) {
            activeWork = "unsaved" // Return to Unsaved Work
            document.getElementById("pattern").value = currentUnsavedWork.pattern;
            document.getElementById("input").value = currentUnsavedWork.input;
            document.getElementById("output").value = currentUnsavedWork.output;
          }
       }

           localStorage.setItem(
             "regexTesterSavedWork",
              JSON.stringify(savedWork)
           );

         // currentUnsavedWork.input = "";
         // currentUnsavedWork.output = "";

          hasUnsavedWork = false;

          loadSavedWork();
      };

      li.appendChild(name);
      li.appendChild(deleteButton);

      savedWorkList.appendChild(li);

  });
}

loadSavedWork(); // Load saved work when the page loads


    </script>
</body>
</html>
